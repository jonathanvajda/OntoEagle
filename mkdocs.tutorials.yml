site_name: OntoEagle Tutorials
site_url: https://jonathanvajda.github.io/OntoEagle/tutorials/
docs_dir: src/tutorials
site_dir: docs/tutorials
use_directory_urls: true

nav:
  - Tutorials: index.md
  - CQ Ferret Tutorial: cq-ferret-tutorial.md

theme:
  name: mkdocs

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js

